name: Deploy API (HostGator)

# La web (deploy-web.yml) sube deploy.php, que este flujo necesita. En el primer
# despliegue corre deploy-web.yml antes que este.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-api.yml'

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (misma versión que el servidor)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, pdo_sqlite

      - name: Pruebas del backend
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan test

      - name: Dependencias de producción
        working-directory: backend
        run: |
          rm -rf vendor
          composer install --no-dev --optimize-autoloader --no-interaction

      - name: Crear api.zip (código + vendor)
        run: |
          mkdir -p staging
          cd backend
          zip -rq ../staging/api.zip . \
            -x '.env' '.env.*' '.git*' 'tests/*' 'node_modules/*' \
               'database/*.sqlite' 'storage/logs/*' 'storage/framework/cache/data/*' \
               'storage/framework/sessions/*' 'storage/framework/views/*'

      # Un solo paso de FTP por destino: dos pasos sobre la misma carpeta se borran entre sí.
      - name: Subir api.zip a rayita_deploy/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./staging/
          server-dir: ${{ secrets.DEPLOY_DIR }}

      - name: Descomprimir en el servidor
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          WEB_URL: ${{ secrets.WEB_URL }}
        run: |
          out=$(curl -fsS -H "X-Deploy-Token: $DEPLOY_TOKEN" "$WEB_URL/deploy.php")
          echo "$out"
          test "$out" = "ok"

      - name: Generar .env de producción y subirlo por HTTPS
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          WEB_URL: ${{ secrets.WEB_URL }}
          API_URL: ${{ secrets.API_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          INVITE_CODE: ${{ secrets.INVITE_CODE }}
        run: |
          # El puerto 465 usa TLS implícito (smtps); los demás, STARTTLS (smtp).
          scheme=smtp; [ "$MAIL_PORT" = "465" ] && scheme=smtps
          {
            echo "APP_NAME=Rayita"
            echo "APP_ENV=production"
            echo "APP_KEY=$APP_KEY"
            echo "APP_DEBUG=false"
            echo "APP_URL=$API_URL"
            echo "APP_LOCALE=es"
            echo "APP_FALLBACK_LOCALE=en"
            echo "LOG_CHANNEL=single"
            echo "LOG_LEVEL=warning"
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=localhost"
            echo "DB_PORT=3306"
            printf "DB_DATABASE='%s'\n" "$DB_DATABASE"
            printf "DB_USERNAME='%s'\n" "$DB_USERNAME"
            printf "DB_PASSWORD='%s'\n" "$DB_PASSWORD"
            echo "SESSION_DRIVER=file"
            echo "CACHE_STORE=file"
            echo "QUEUE_CONNECTION=sync"
            echo "MAIL_MAILER=smtp"
            echo "MAIL_SCHEME=$scheme"
            printf "MAIL_HOST='%s'\n" "$MAIL_HOST"
            echo "MAIL_PORT=$MAIL_PORT"
            printf "MAIL_USERNAME='%s'\n" "$MAIL_USERNAME"
            printf "MAIL_PASSWORD='%s'\n" "$MAIL_PASSWORD"
            printf "MAIL_FROM_ADDRESS='%s'\n" "$MAIL_FROM_ADDRESS"
            echo 'MAIL_FROM_NAME="Rayita"'
            printf "INVITE_CODE='%s'\n" "$INVITE_CODE"
          } > .env.production
          curl -fsS -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            --data-binary @.env.production "$WEB_URL/deploy.php?action=write-env"
          rm -f .env.production

      - name: Migraciones
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          WEB_URL: ${{ secrets.WEB_URL }}
        run: curl -fsS -H "X-Deploy-Token: $DEPLOY_TOKEN" "$WEB_URL/deploy.php?action=migrate"

      - name: Cachés de config, rutas y vistas
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          WEB_URL: ${{ secrets.WEB_URL }}
        run: curl -fsS -H "X-Deploy-Token: $DEPLOY_TOKEN" "$WEB_URL/deploy.php?action=optimize"

      - name: Verificar que la API responde
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          WEB_URL: ${{ secrets.WEB_URL }}
        run: |
          out=$(curl -fsS -H "X-Deploy-Token: $DEPLOY_TOKEN" "$WEB_URL/deploy.php?action=diag")
          echo "$out"
          echo "$out" | head -1 | grep -qx 200
