name: Operación del servidor (sin SSH)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción del extractor de despliegue'
        required: true
        default: 'diag'
        type: choice
        options:
          - diag
          - migrate-status
          - migrate
          - optimize
          - logs
          - stats
          - set-invite-code
          - set-google-client-id
          - set-google-ios-client-id
          - mail-test
      value:
        description: 'set-invite-code: nuevo código (vacío = registro abierto). set-google-client-id / set-google-ios-client-id: ID de cliente de Google (vacío = desactivar). mail-test: correo de destino'
        required: false
        type: string

env:
  WEB_URL: https://rayita.alanbazan.com.mx

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar la acción
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          ACTION: ${{ inputs.action }}
          VALUE: ${{ inputs.value }}
        run: |
          case "$ACTION" in
            set-invite-code)       NAME=INVITE_CODE ;;
            set-google-client-id)  NAME=GOOGLE_CLIENT_ID ;;
            set-google-ios-client-id) NAME=GOOGLE_IOS_CLIENT_ID ;;
            *) NAME= ;;
          esac
          if [ -n "$NAME" ]; then
            curl -fsS -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" \
              --data-urlencode "name=$NAME" --data-urlencode "value=$VALUE" \
              "$WEB_URL/deploy.php?action=set-env"
          elif [ "$ACTION" = "mail-test" ]; then
            curl -fsS -G -H "X-Deploy-Token: $DEPLOY_TOKEN" \
              --data-urlencode "action=mail-test" --data-urlencode "to=$VALUE" "$WEB_URL/deploy.php"
          else
            curl -fsS -H "X-Deploy-Token: $DEPLOY_TOKEN" "$WEB_URL/deploy.php?action=$ACTION"
          fi
